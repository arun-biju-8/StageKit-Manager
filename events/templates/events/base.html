<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>{% block title %}StageKit Manager{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                            "surface-variant": "var(--surface-container-highest)",
                            "on-tertiary": "#ffffff",
                            "primary-container": "#4f46e5",
                            "tertiary-fixed-dim": "#ffb695",
                            "primary-fixed-dim": "#c3c0ff",
                            "outline": "#777587",
                            "surface-container-lowest": "var(--surface-container-lowest)",
                            "surface-bright": "#fcf8ff",
                            "tertiary-container": "#a44100",
                            "surface-tint": "#4d44e3",
                            "surface-container": "var(--surface-container)",
                            "inverse-surface": "var(--inverse-surface)",
                            "on-secondary-container": "#231791",
                            "on-error-container": "#93000a",
                            "error-container": "#ffdad6",
                            "on-primary": "#ffffff",
                            "on-primary-container": "#dad7ff",
                            "on-secondary": "#ffffff",
                            "on-error": "#ffffff",
                            "surface-container-low": "var(--surface-container-low)",
                            "secondary-container": "#8f8bff",
                            "secondary-fixed": "#e2dfff",
                            "inverse-on-surface": "#f3effc",
                            "error": "#ba1a1a",
                            "primary": "#3525cd",
                            "surface-container-highest": "var(--surface-container-highest)",
                            "surface-dim": "#dcd8e5",
                            "on-surface": "var(--on-surface)",
                            "on-tertiary-container": "#ffd2be",
                            "on-tertiary-fixed": "#351000",
                            "inverse-primary": "#c3c0ff",
                            "on-primary-fixed": "#0f0069",
                            "background": "var(--background)",
                            "primary-fixed": "#e2dfff",
                            "tertiary": "#7e3000",
                            "surface-container-high": "var(--surface-container-high)",
                            "secondary": "#544fc0",
                            "on-primary-fixed-variant": "#3323cc",
                            "on-tertiary-fixed-variant": "#7b2f00",
                            "secondary-fixed-dim": "#c3c0ff",
                            "on-surface-variant": "var(--on-surface-variant)",
                            "surface": "var(--surface)",
                            "tertiary-fixed": "#ffdbcc",
                            "on-background": "var(--on-background)",
                            "on-secondary-fixed": "#0f0069",
                            "outline-variant": "var(--outline-variant)",
                            "on-secondary-fixed-variant": "#3b35a7"
                    },
                    "borderRadius": {
                            "DEFAULT": "0.25rem",
                            "lg": "0.5rem",
                            "xl": "0.75rem",
                            "full": "9999px"
                    },
                    "spacing": {
                            "margin": "32px",
                            "xs": "4px",
                            "base": "8px",
                            "gutter": "24px",
                            "xl": "80px",
                            "md": "24px",
                            "sm": "12px",
                            "lg": "48px"
                    },
                    "fontFamily": {
                            "body-md": ["Inter"],
                            "body-lg": ["Inter"],
                            "label-sm": ["Inter"],
                            "h3": ["Inter"],
                            "h2": ["Inter"],
                            "display": ["Inter"],
                            "h1": ["Inter"]
                    },
                    "fontSize": {
                            "body-md": ["16px", {"lineHeight": "1.6", "fontWeight": "400"}],
                            "body-lg": ["18px", {"lineHeight": "1.6", "fontWeight": "400"}],
                            "label-sm": ["14px", {"lineHeight": "1.0", "letterSpacing": "0.01em", "fontWeight": "500"}],
                            "h3": ["20px", {"lineHeight": "1.4", "fontWeight": "600"}],
                            "h2": ["24px", {"lineHeight": "1.3", "fontWeight": "600"}],
                            "display": ["48px", {"lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                            "h1": ["32px", {"lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700"}]
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --background: #fcf8ff;
            --on-background: #1b1b24;
            --surface: #fcf8ff;
            --on-surface: #1b1b24;
            --surface-container: #f0ecf9;
            --surface-container-low: #f5f2ff;
            --surface-container-high: #eae6f4;
            --surface-container-highest: #e4e1ee;
            --surface-container-lowest: #ffffff;
            --outline-variant: #c7c4d8;
            --on-surface-variant: #464555;
            --inverse-surface: #302f39;
        }

        .dark {
            --background: #0f0e13;
            --on-background: #e4e1ee;
            --surface: #1b1b24;
            --on-surface: #e4e1ee;
            --surface-container: #24232e;
            --surface-container-low: #1e1d25;
            --surface-container-high: #2d2c38;
            --surface-container-highest: #383745;
            --surface-container-lowest: #0a0a0f;
            --outline-variant: #464555;
            --on-surface-variant: #c7c4d8;
            --inverse-surface: #fcf8ff;
        }

        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined';
            font-weight: normal;
            font-style: normal;
            font-size: 24px;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            display: inline-block;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            -webkit-font-feature-settings: 'liga';
            -webkit-font-smoothing: antialiased;
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 32px 0 rgba(55, 48, 163, 0.05);
        }
        .table-row-hover {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .table-row-hover:hover {
            background-color: rgba(234, 230, 244, 0.5);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(55, 48, 163, 0.05);
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md text-body-md {% block body_class %}flex flex-col min-h-screen antialiased selection:bg-primary selection:text-on-primary{% endblock %}">
    
    {% if messages %}
    <div class="fixed top-4 right-4 z-50 flex flex-col gap-2 pointer-events-none">
        {% for message in messages %}
        <div id="message-{{ forloop.counter }}" class="glass-panel p-4 rounded-xl shadow-lg border-l-4 {% if message.tags == 'error' %}border-error text-error{% elif message.tags == 'success' %}border-emerald-500 text-emerald-700{% else %}border-primary text-primary{% endif %} animate-fade-in-down flex items-center justify-between gap-4 pointer-events-auto min-w-[300px]">
            <div class="flex-1">{{ message }}</div>
            <button onclick="this.parentElement.remove()" class="p-1 hover:bg-black/5 rounded-full transition-colors flex items-center justify-center">
                <span class="material-symbols-outlined text-[18px]">close</span>
            </button>
        </div>
        {% endfor %}
    </div>
    {% endif %}

    <!-- Top Left Logo -->
    <a href="{% url 'home' %}" class="fixed top-6 left-6 z-[60] flex items-center gap-2 group transition-all duration-300">
        <div class="w-10 h-10 bg-primary rounded-xl flex items-center justify-center shadow-lg shadow-primary/20 group-hover:scale-110 group-hover:rotate-3 transition-all duration-300">
            <span class="material-symbols-outlined text-on-primary" style="font-variation-settings: 'FILL' 1;">theater_comedy</span>
        </div>
        <span class="font-display text-h3 font-bold text-primary dark:text-primary-fixed-dim drop-shadow-sm group-hover:translate-x-1 transition-all">StageKit</span>
    </a>

    <!-- Dark Mode Toggle -->
    <button id="darkModeToggle" class="fixed bottom-6 right-6 z-[60] w-12 h-12 glass-panel rounded-full shadow-2xl flex items-center justify-center text-primary hover:scale-110 active:scale-95 transition-all duration-300 border border-primary/20">
        <span class="material-symbols-outlined" id="darkIcon">dark_mode</span>
    </button>

    <script>
        const html = document.documentElement;
        const darkModeToggle = document.getElementById('darkModeToggle');
        const darkIcon = document.getElementById('darkIcon');

        // Check for saved theme preference
        if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            html.classList.add('dark');
            html.classList.remove('light');
            darkIcon.textContent = 'light_mode';
        }

        darkModeToggle.addEventListener('click', () => {
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                html.classList.add('light');
                darkIcon.textContent = 'dark_mode';
                localStorage.setItem('theme', 'light');
            } else {
                html.classList.add('dark');
                html.classList.remove('light');
                darkIcon.textContent = 'light_mode';
                localStorage.setItem('theme', 'dark');
            }
        });
    </script>

    {% block content %}{% endblock %}

</body>
</html>

{% extends 'events/base.html' %}

{% block body_class %}bg-surface text-on-surface font-body-md min-h-screen flex items-center justify-center p-4 relative overflow-hidden{% endblock %}

{% block content %}
<style>
    /* Removed floating labels for cleaner design */
</style>

<div class="absolute inset-0 z-0 pointer-events-none overflow-hidden">
    <div class="absolute top-[-20%] left-[-10%] w-[50%] h-[50%] rounded-full bg-primary-container/20 blur-[100px]"></div>
</div>

<div class="w-full max-w-[480px] z-10">
    <div class="glass-panel rounded-[24px] p-lg w-full transform transition-all duration-300 shadow-2xl">
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-surface-container shadow-sm mb-4">
                <span class="material-symbols-outlined text-h1 text-primary" style="font-variation-settings: 'FILL' 1;">key</span>
            </div>
            <h1 class="font-h1 text-h1 text-on-surface mb-2 tracking-tight">Set New Password</h1>
        </div>

        <form method="POST" class="space-y-6">
            {% csrf_token %}
            <input type="hidden" name="email" value="{{ email }}">
            
            <div class="space-y-2">
                <label for="new_password" class="font-label-sm text-label-sm text-on-surface-variant ml-1">New Password</label>
                <div class="relative bg-surface-container-low rounded-xl border border-outline-variant focus-within:border-primary focus-within:ring-1 focus-within:ring-primary transition-all duration-200">
                    <input type="password" name="new_password" class="block w-full px-4 py-3 text-on-surface bg-transparent border-0 focus:ring-0 pr-12" id="new_password" required>
                    <button type="button" class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors" onclick="const p = document.getElementById('new_password'); const i = this.querySelector('span'); if(p.type==='password'){p.type='text'; i.textContent='visibility';}else{p.type='password'; i.textContent='visibility_off';}">
                        <span class="material-symbols-outlined">visibility_off</span>
                    </button>
                </div>
            </div>

            <div class="space-y-2">
                <label for="confirm_password" class="font-label-sm text-label-sm text-on-surface-variant ml-1">Confirm Password</label>
                <div class="relative bg-surface-container-low rounded-xl border border-outline-variant focus-within:border-primary focus-within:ring-1 focus-within:ring-primary transition-all duration-200">
                    <input type="password" name="confirm_password" class="block w-full px-4 py-3 text-on-surface bg-transparent border-0 focus:ring-0 pr-12" id="confirm_password" required>
                    <button type="button" class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors" onclick="const p = document.getElementById('confirm_password'); const i = this.querySelector('span'); if(p.type==='password'){p.type='text'; i.textContent='visibility';}else{p.type='password'; i.textContent='visibility_off';}">
                        <span class="material-symbols-outlined">visibility_off</span>
                    </button>
                </div>
            </div>

            <button type="submit" class="w-full flex justify-center py-4 px-4 border border-transparent rounded-xl shadow-sm font-label-sm text-label-sm text-on-primary bg-primary hover:bg-on-primary-fixed-variant transition-all duration-200 active:scale-95">
                Update Password
            </button>
        </form>
    </div>
</div>
{% endblock %}

<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>StageKit Manager - Authentication</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "surface-variant": "#e4e1ee",
                        "on-tertiary": "#ffffff",
                        "primary-container": "#4f46e5",
                        "tertiary-fixed-dim": "#ffb695",
                        "primary-fixed-dim": "#c3c0ff",
                        "outline": "#777587",
                        "surface-container-lowest": "#ffffff",
                        "surface-bright": "#fcf8ff",
                        "tertiary-container": "#a44100",
                        "surface-tint": "#4d44e3",
                        "surface-container": "#f0ecf9",
                        "inverse-surface": "#302f39",
                        "on-secondary-container": "#231791",
                        "on-error-container": "#93000a",
                        "error-container": "#ffdad6",
                        "on-primary": "#ffffff",
                        "on-primary-container": "#dad7ff",
                        "on-secondary": "#ffffff",
                        "on-error": "#ffffff",
                        "surface-container-low": "#f5f2ff",
                        "secondary-container": "#8f8bff",
                        "secondary-fixed": "#e2dfff",
                        "inverse-on-surface": "#f3effc",
                        "error": "#ba1a1a",
                        "primary": "#3525cd",
                        "surface-container-highest": "#e4e1ee",
                        "surface-dim": "#dcd8e5",
                        "on-surface": "#1b1b24",
                        "on-tertiary-container": "#ffd2be",
                        "on-tertiary-fixed": "#351000",
                        "inverse-primary": "#c3c0ff",
                        "on-primary-fixed": "#0f0069",
                        "background": "#fcf8ff",
                        "primary-fixed": "#e2dfff",
                        "tertiary": "#7e3000",
                        "surface-container-high": "#eae6f4",
                        "secondary": "#544fc0",
                        "on-primary-fixed-variant": "#3323cc",
                        "on-tertiary-fixed-variant": "#7b2f00",
                        "secondary-fixed-dim": "#c3c0ff",
                        "on-surface-variant": "#464555",
                        "surface": "#fcf8ff",
                        "tertiary-fixed": "#ffdbcc",
                        "on-background": "#1b1b24",
                        "on-secondary-fixed": "#0f0069",
                        "outline-variant": "#c7c4d8",
                        "on-secondary-fixed-variant": "#3b35a7"
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    spacing: {
                        "margin": "32px",
                        "xs": "4px",
                        "base": "8px",
                        "gutter": "24px",
                        "xl": "80px",
                        "md": "24px",
                        "sm": "12px",
                        "lg": "48px"
                    },
                    fontFamily: {
                        "body-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "label-sm": ["Inter"],
                        "h3": ["Inter"],
                        "h2": ["Inter"],
                        "display": ["Inter"],
                        "h1": ["Inter"]
                    },
                    fontSize: {
                        "body-md": ["16px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "label-sm": ["14px", { "lineHeight": "1.0", "letterSpacing": "0.01em", "fontWeight": "500" }],
                        "h3": ["20px", { "lineHeight": "1.4", "fontWeight": "600" }],
                        "h2": ["24px", { "lineHeight": "1.3", "fontWeight": "600" }],
                        "display": ["48px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "h1": ["32px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.fill {
            font-variation-settings: 'FILL' 1;
        }
        
        /* Floating Label Styles */
        .floating-input:focus-within label,
        .floating-input input:not(:placeholder-shown) + label {
            transform: translateY(-50%) scale(0.85);
            top: 0;
            left: 12px;
            background-color: transparent; /* Changed to transparent for glass look */
            padding: 0 4px;
            color: theme('colors.primary');
        }

        /* Glassmorphism utility */
        .glass-panel {
            background: rgba(252, 248, 255, 0.7); /* surface-bright with opacity */
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 32px 0 rgba(53, 37, 205, 0.05); /* Tinted with primary */
        }
    </style>
</head>
<body class="bg-surface text-on-surface font-body-md min-h-screen flex items-center justify-center p-4 relative overflow-hidden">
<!-- Ambient Background Decoration -->
<div class="absolute inset-0 z-0 pointer-events-none overflow-hidden">
<div class="absolute top-[-20%] left-[-10%] w-[50%] h-[50%] rounded-full bg-primary-container/20 blur-[100px]"></div>
<div class="absolute bottom-[-20%] right-[-10%] w-[60%] h-[60%] rounded-full bg-secondary-container/10 blur-[120px]"></div>
</div>
<!-- Main Container - Login Step (Active) -->
<div class="w-full max-w-[480px] z-10">
<!-- Login Card -->
<div class="glass-panel rounded-[24px] p-lg w-full transform transition-all duration-300">
<!-- Header -->
<div class="text-center mb-8">
<div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-surface-container shadow-sm mb-4">
<span class="material-symbols-outlined text-h1 text-primary fill" data-icon="inventory_2" data-weight="fill">inventory_2</span>
</div>
<h1 class="font-h1 text-h1 text-on-surface mb-2 tracking-tight">StageKit Manager</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Luminous Precision in Logistics.</p>
</div>
<!-- Login Form -->
<form class="space-y-6">
<!-- Email Input -->
<div class="relative floating-input bg-surface-container-low rounded-xl border border-outline-variant focus-within:border-primary focus-within:ring-1 focus-within:ring-primary transition-all duration-200">
<input class="block w-full px-4 pt-6 pb-2 text-on-surface bg-transparent border-0 focus:ring-0 peer placeholder-transparent" id="email" placeholder=" " required="" type="email"/>
<label class="absolute text-on-surface-variant font-body-md text-body-md duration-200 transform -translate-y-1/2 top-1/2 left-4 z-10 origin-[0] peer-focus:text-primary pointer-events-none" for="email">Email address</label>
</div>
<!-- Password Input -->
<div class="relative floating-input bg-surface-container-low rounded-xl border border-outline-variant focus-within:border-primary focus-within:ring-1 focus-within:ring-primary transition-all duration-200">
<input class="block w-full px-4 pt-6 pb-2 text-on-surface bg-transparent border-0 focus:ring-0 peer placeholder-transparent pr-12" id="password" placeholder=" " required="" type="password"/>
<label class="absolute text-on-surface-variant font-body-md text-body-md duration-200 transform -translate-y-1/2 top-1/2 left-4 z-10 origin-[0] peer-focus:text-primary pointer-events-none" for="password">Password</label>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined" data-icon="visibility_off">visibility_off</span>
</button>
</div>
<!-- Remember & Forgot -->
<div class="flex items-center justify-between mt-4">
<div class="flex items-center">
<input class="h-4 w-4 text-primary focus:ring-primary border-outline-variant rounded bg-surface-container-low" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-2 block font-label-sm text-label-sm text-on-surface-variant" for="remember-me">
                            Remember me
                        </label>
</div>
<div class="text-sm">
<a class="font-label-sm text-label-sm text-primary hover:text-primary-fixed-variant transition-colors" href="#">
                            Forgot password?
                        </a>
</div>
</div>
<!-- Action Button -->
<button class="w-full flex justify-center py-4 px-4 border border-transparent rounded-xl shadow-sm font-label-sm text-label-sm text-on-primary bg-primary hover:bg-on-primary-fixed-variant focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary active:scale-95 transition-all duration-200" type="submit">
                    Sign in to Workspace
                </button>
</form>
<!-- Footer Links -->
<div class="mt-8 text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                    Need an account? 
                    <a class="font-label-sm text-label-sm text-primary hover:text-primary-fixed-variant transition-colors ml-1" href="#">Request Access</a>
</p>
</div>
</div>
</div>
</body></html>
